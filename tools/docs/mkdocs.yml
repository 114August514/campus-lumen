site_name: Campus Agora
site_description: Campus Agora 工程与协作文档
docs_dir: ../../docs
site_dir: ../../site
strict: true
exclude_docs: |
  superpowers/specs/**
  superpowers/plans/**

nav:
  - 首页: index.md
  - 产品:
      - 需求分析 v1.0: product/requirements-handoff.md
      - 概览: product/overview.md
      - 需求论证与研究记录: product/needs-analysis.md
      - 需求基线与分析契约: product/requirements.md
      - 选导师任务与信息结构: product/advisor-task-design.md
      - UI 组件与视觉规范: product/ui-system.md
      - 前端预设计（评审稿）:
          - 评审入口: product/frontend-pre-design/index.md
          - Kimi 一页结论: product/frontend-pre-design/summary.md
          - Kimi 独立设计原稿: product/frontend-pre-design/design-draft.md
          - Kimi 研究记录: product/frontend-pre-design/research-notes.md
      - 隐私: product/privacy.md
      - 里程碑: product/milestones.md
  - 架构:
      - 概览: architecture/overview.md
      - API 契约: architecture/api-contracts.md
      - 认证与权限: architecture/auth-permissions.md
      - 后端: architecture/backend.md
      - 桌面端: architecture/desktop.md
  - 工程:
      - 开发: engineering/development.md
      - 质量门禁: engineering/quality.md
      - Git LFS: engineering/lfs.md
  - 约束:
      - 阅读地图: constraints/index.md
      - 成熟团队需求分析方法: constraints/requirements-practice-reference.md
      - 开源项目复用调研: constraints/open-source-reuse-reference.md
      - 导师来源试采: constraints/mentor-source-reference.md
      - AIDS 导师调研: constraints/aids-mentor-research.md
      - 导师工作流需求证据: constraints/mentor-workflow-evidence.md
      - 全产品需求地图: constraints/opportunity-needs-map.md
      - 学生发展文献调研: constraints/student-development-literature.md
      - 旧产品定位（历史）: constraints/product-positioning-reference.md
      - 旧内容边界（历史）: constraints/content-boundary-reference.md
      - 旧资料社区（历史）: constraints/archive-community-reference.md
      - 前端: constraints/frontend-reference.md
      - 后端: constraints/backend-reference.md
      - API 契约: constraints/api-contract-reference.md
      - Monorepo: constraints/monorepo-reference.md
      - 运维风险: constraints/operations-risk-reference.md
      - 产品治理: constraints/product-governance-reference.md
      - 高级工程: constraints/advanced-engineering-reference.md
  - 运维:
      - 概览: operations/overview.md
      - 部署: operations/deployment.md
      - 安全: operations/security.md
  - AI Log:
      - Todo: ai-log/todo.md
      - Done: ai-log/done.md
